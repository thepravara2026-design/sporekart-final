spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0&tcpKeepAlive=true&connectTimeout=10&socketTimeout=60}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 150000
      keepalive-time: 30000
      validation-timeout: 2500
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        default_batch_fetch_size: 50
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
    com.sporekart: INFO
    org.springframework.security: WARN

app:
  razorpay:
    mock-mode: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.sporekart.in,https://sporekart-staging.vercel.app}

sporekart:
  mail:
    use-real-smtp: ${USE_REAL_SMTP:true}
  shiprocket:
    use-real-shiprocket: ${USE_REAL_SHIPROCKET:false}
