spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sporekart_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

logging:
  level:
    com.sporekart: DEBUG
    org.springframework.security: DEBUG
