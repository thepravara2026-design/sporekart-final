spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sporekart_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        default_batch_fetch_size: 50
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.sporekart: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2X2Zha2Vfand0X3NlY3JldF9rZXlfMzJieXRlcyE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_fake_dev_key_id}
    key-secret: ${RAZORPAY_KEY_SECRET:fake_dev_key_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:fake_dev_webhook_secret}
    mock-mode: ${RAZORPAY_MOCK_MODE:false}
  supabase:
    url: ${SUPABASE_URL:https://fake-dev-supabase.sporekart.in}
    bucket: ${SUPABASE_BUCKET:sporekart-media}
    anon-key: ${SUPABASE_ANON_KEY:fake_dev_anon_key}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:fake_dev_service_role_key}

sporekart:
  shiprocket:
    use-real-shiprocket: false
    webhook-token: ${SHIPROCKET_WEBHOOK_TOKEN:fake_dev_shiprocket_webhook_token}
