version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporekart-db
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-sporekart}
      POSTGRES_USER: ${SUPABASE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sporekart"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sporekart-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SUPABASE_DB_NAME:-sporekart}
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

